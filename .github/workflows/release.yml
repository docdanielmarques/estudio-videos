name: Publicar release do vídeo
on:
  push:
    paths: ['inbox/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar vídeo e criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for dir in inbox/*/; do
            name=$(basename "$dir")
            if ls "$dir"part-* >/dev/null 2>&1; then
              cat "$dir"part-* > "$name.mp4"
            else
              cp "$dir"video.mp4 "$name.mp4"
            fi
            files="$name.mp4"
            if [ -f "$dir/capa.jpg" ]; then cp "$dir/capa.jpg" "$name-capa.jpg"; files="$files $name-capa.jpg"; fi
            gh release delete "$name" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$name" $files --title "$name" --notes "Vídeo aprovado: $name"
            echo "https://github.com/${{ github.repository }}/releases/download/$name/$name.mp4"
            git rm -rq "$dir"
          done
          git config user.name "estudio-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "Limpa inbox após release" || true
          git push || true
